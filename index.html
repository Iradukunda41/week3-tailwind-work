<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <title>Flex & Grid</title>
</head>

<body>
     <div
          class="flex m-4 gap-8 text-white text-md font-bold justify-start items-start border-b border-gray-600 border-double pb-16">
          <div class="bg-red-500 p-8 h-4 w-4">1</div>
          <div class="bg-blue-500 p-8 h-4 w-4">2</div>
          <div class="bg-green-500 p-8 h-4 w-4 order-2">3</div>
          <div class="bg-yellow-500 p-8 h-4 w-4">4</div>
     </div>
     </div>
     <div class=" text-white font-bold text-2xl grid grid-row-3 grid-cols-3 grid gap-8">
          <div
               class=" bg-purple-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               1</div>
          <div
               class=" bg-green-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               2</div>
          <div
               class=" bg-yellow-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               3</div>
          <div
               class=" bg-red-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               4</div>
          <div
               class=" bg-blue-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               5</div>
          <div
               class=" bg-pink-600 p-8 h-12 w-[30%] rounded-lg flex justify-center items-center shadow-lg  border-white-600 border-2">
               6</div>
     </div>
</body>

</html>
